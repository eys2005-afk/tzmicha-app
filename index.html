<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F8F7F4" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>צמיחה · לוז וחשבון נפש</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #F8F7F4; color: #1A1A1A; direction: rtl; padding-bottom: 78px; }
    .header { background: #fff; padding: 16px 16px 12px; text-align: center; border-bottom: 1px solid #E0DED8; position: sticky; top: 0; z-index: 10; }
    .header h1 { font-size: 20px; font-weight: 600; }
    .header p { font-size: 12px; color: #999; margin-top: 2px; }
    .content { padding: 12px; max-width: 620px; margin: 0 auto; }
    .tab { display: none; }
    .tab.active { display: block; }

    /* כותרת היום */
    .dateline { font-size: 13px; color: #888; text-align: center; margin-bottom: 10px; }
    .memberbar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
    .chip { padding: 6px 16px; border: 1px solid #E0DED8; border-radius: 20px; background: #fff; font-size: 14px; color: #555; cursor: pointer; font-weight: 500; }
    .chip.active { font-weight: 600; }
    .todaypts { text-align: center; font-size: 13px; color: #633806; background: #FBF6EC; border: 1px solid #F0E6D2; border-radius: 10px; padding: 6px; margin-bottom: 14px; }
    .todaypts b { font-size: 15px; }

    .section-label { font-size: 12px; font-weight: 600; color: #999; margin: 16px 4px 8px; letter-spacing: .03em; }

    /* שורת משימה */
    .trow { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #E0DED8; border-radius: 12px; padding: 12px; margin-bottom: 8px; transition: background .15s, border-color .15s; }
    .trow.s-done { background: #F1F8EA; border-color: #CDE6B4; }
    .trow.s-fail { background: #FCF0F0; border-color: #F2CFCF; }
    .trow.s-partial { background: #FBF6EC; border-color: #EFE0C4; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .tmain { flex: 1; min-width: 0; }
    .ttitle { font-size: 15px; font-weight: 500; }
    .tmeta { font-size: 11px; color: #999; margin-top: 3px; }
    .tbtns { display: flex; gap: 5px; flex-shrink: 0; }
    .sb { width: 34px; height: 34px; border-radius: 9px; border: 1px solid #E0DED8; background: #fff; font-size: 15px; cursor: pointer; color: #aaa; display: flex; align-items: center; justify-content: center; }
    .sb.done.on { background: #2E7D32; border-color: #2E7D32; color: #fff; }
    .sb.fail.on { background: #C62828; border-color: #C62828; color: #fff; }
    .sb.part.on { background: #B9821B; border-color: #B9821B; color: #fff; }

    /* כרטיסים */
    .card { background: #fff; border: 1px solid #E0DED8; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .aicon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .aname { font-size: 16px; font-weight: 600; flex: 1; }
    .sub { font-size: 12px; color: #999; margin-top: 2px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; flex-shrink: 0; }
    .avatar.sm { width: 30px; height: 30px; font-size: 14px; display: inline-flex; vertical-align: middle; margin-left: 6px; }

    .grow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 4px; border-top: 1px solid #F1EFE8; }
    .grow:first-of-type { border-top: none; }
    .gtitle { font-size: 14px; font-weight: 500; }
    .gmeta { font-size: 11px; color: #999; margin-top: 2px; }
    .off { color: #C62828; }

    .mini { width: 30px; height: 30px; border-radius: 8px; border: 1px solid #E0DED8; background: #fff; cursor: pointer; font-size: 13px; color: #777; margin-right: 4px; }
    .mini.danger { color: #C62828; border-color: #F2CFCF; }
    .addbtn { width: 100%; padding: 10px; border: 1px dashed #C7C4BA; border-radius: 10px; background: #FAFAF8; color: #555; cursor: pointer; font-size: 13px; margin-top: 8px; font-weight: 500; }
    .addbtn.big { border-style: solid; border-color: #1A1A1A; background: #1A1A1A; color: #fff; }
    .danger-btn { width: 100%; padding: 11px; border: 1px solid #F09595; border-radius: 10px; background: #FCEBEB; color: #791F1F; cursor: pointer; font-size: 13px; margin-top: 8px; font-weight: 500; }

    /* ניקוד */
    .seg { display: flex; gap: 6px; background: #F1EFE8; border-radius: 10px; padding: 4px; margin-bottom: 14px; }
    .seg button { flex: 1; padding: 8px; border: none; border-radius: 8px; background: transparent; font-size: 13px; color: #888; cursor: pointer; font-weight: 500; }
    .seg button.active { background: #fff; color: #1A1A1A; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .combined { text-align: center; font-size: 15px; color: #633806; background: #FBF6EC; border: 1px solid #F0E6D2; border-radius: 12px; padding: 12px; margin-bottom: 14px; font-weight: 500; }
    .combined b { font-size: 20px; }
    .statgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
    .stat { background: #F8F7F4; border-radius: 10px; padding: 10px 4px; text-align: center; }
    .stat b { display: block; font-size: 20px; font-weight: 600; }
    .stat span { font-size: 10px; color: #999; }
    .stat.ok b { color: #2E7D32; } .stat.bad b { color: #C62828; } .stat.mid b { color: #B9821B; }
    .breakdown { border-top: 1px solid #F1EFE8; padding-top: 10px; }
    .bd-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
    .bd-name { font-size: 12px; width: 95px; flex-shrink: 0; color: #444; }
    .bar-wrap { flex: 1; background: #F1EFE8; border-radius: 20px; height: 8px; overflow: hidden; }
    .bar { height: 8px; border-radius: 20px; transition: width .5s; }
    .bd-pts { font-size: 12px; font-weight: 600; color: #633806; width: 28px; text-align: left; }

    /* חשבון נפש */
    .refl-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .refl-scope { font-size: 12px; font-weight: 600; color: #fff; background: #7A5BD0; padding: 2px 10px; border-radius: 8px; }
    .refl-date { font-size: 12px; color: #999; }
    .stars { color: #E8B53D; font-size: 16px; margin-bottom: 6px; letter-spacing: 2px; }
    .refl-text { font-size: 14px; color: #333; line-height: 1.6; white-space: pre-wrap; }
    .refl .mini { margin-top: 10px; width: auto; padding: 0 12px; }

    .empty { text-align: center; padding: 40px 20px; color: #aaa; font-size: 14px; line-height: 1.7; }
    .footnote { text-align: center; font-size: 11px; color: #bbb; margin: 20px 0; }

    /* ניווט תחתון */
    .nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #fff; border-top: 1px solid #E0DED8; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 20; }
    .nav button { flex: 1; border: none; background: none; cursor: pointer; padding: 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #aaa; font-size: 10px; }
    .nav button .ic { font-size: 20px; }
    .nav button.active { color: #1A1A1A; font-weight: 600; }

    /* מודאל */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; align-items: flex-end; justify-content: center; }
    .overlay.show { display: flex; }
    .modal { background: #fff; border-radius: 18px 18px 0 0; padding: 20px; width: 100%; max-width: 620px; max-height: 88vh; overflow-y: auto; }
    @media (min-width: 560px) { .overlay { align-items: center; } .modal { border-radius: 18px; } }
    .modal h2 { font-size: 17px; font-weight: 600; margin-bottom: 14px; text-align: center; }
    .modal label { display: block; font-size: 13px; color: #777; margin-bottom: 12px; font-weight: 500; }
    .modal input, .modal select, .modal textarea { width: 100%; padding: 11px; border: 1px solid #E0DED8; border-radius: 10px; font-size: 16px; margin-top: 5px; background: #fff; color: #1A1A1A; font-family: inherit; }
    .modal input[type=color] { height: 46px; padding: 4px; }
    .modal textarea { resize: vertical; }
    .modal-btns { display: flex; gap: 8px; margin-top: 6px; }
    .modal-btns button { flex: 1; padding: 13px; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; font-weight: 600; }
    .modal-btns .confirm { background: #1A1A1A; color: #fff; }
    .modal-btns .cancel { background: #F1EFE8; color: #1A1A1A; }
  </style>
</head>
<body>

<div class="header">
  <h1>🌱 צמיחה</h1>
  <p>לוז יומי · מעקב מידות · חשבון נפש</p>
</div>

<div class="content">
  <div class="tab active" id="tab-today">
    <div id="todayHead"></div>
    <div id="todayList"></div>
  </div>

  <div class="tab" id="tab-goals">
    <div class="section-label">תחומים ומשימות</div>
    <div id="goalsList"></div>
  </div>

  <div class="tab" id="tab-score">
    <div id="scoreList"></div>
  </div>

  <div class="tab" id="tab-reflect">
    <div id="reflectList"></div>
  </div>

  <div class="tab" id="tab-settings">
    <div id="settingsList"></div>
  </div>
</div>

<div class="nav">
  <button class="active" onclick="switchTab('today', this)"><span class="ic">📅</span>היום</button>
  <button onclick="switchTab('goals', this)"><span class="ic">🎯</span>יעדים</button>
  <button onclick="switchTab('score', this)"><span class="ic">🏆</span>ניקוד</button>
  <button onclick="switchTab('reflect', this)"><span class="ic">📝</span>חשבון נפש</button>
  <button onclick="switchTab('settings', this)"><span class="ic">⚙️</span>הגדרות</button>
</div>

<div class="overlay" id="formModal">
  <div class="modal">
    <h2 id="formTitle"></h2>
    <div id="formBody"></div>
    <div class="modal-btns">
      <button class="cancel" onclick="closeForm()">ביטול</button>
      <button class="confirm" onclick="submitForm()">שמירה</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
