<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1b5e20" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>צמיחה · לוז וחשבון נפש</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, "Segoe UI", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #f0efec; color: #111827; direction: rtl; padding-bottom: 80px; }

    /* ===== Header ===== */
    .header {
      background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 60%, #388e3c 100%);
      padding: 18px 16px 14px;
      text-align: center;
      position: sticky; top: 0; z-index: 10;
      box-shadow: 0 2px 10px rgba(0,0,0,.2);
    }
    .header h1 { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -.3px; }
    .header p  { font-size: 12px; color: rgba(255,255,255,.7); margin-top: 3px; }

    /* ===== Layout ===== */
    .content { padding: 14px; max-width: 620px; margin: 0 auto; }
    .tab { display: none; }
    .tab.active { display: block; }

    /* ===== Today header ===== */
    .dateline { font-size: 13px; color: #6b7280; text-align: center; margin-bottom: 10px; }
    .memberbar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
    .chip {
      padding: 7px 20px; border: 2px solid #d1d5db; border-radius: 99px;
      background: #fff; font-size: 14px; color: #555; cursor: pointer;
      font-weight: 500; transition: all .15s;
    }
    .chip.active { border-color: transparent; font-weight: 700; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
    .todaypts {
      text-align: center; font-size: 13px; color: #92400e;
      background: #fffbeb; border: 1px solid #fde68a;
      border-radius: 12px; padding: 8px; margin-bottom: 16px;
    }
    .todaypts b { font-size: 17px; }

    /* ===== Learning card ===== */
    .learn-card {
      background: #fff; border-radius: 16px; margin-bottom: 18px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.05);
    }
    .learn-title {
      background: linear-gradient(90deg, #78350f, #b45309);
      color: #fff; font-size: 13px; font-weight: 700;
      padding: 11px 14px; letter-spacing: .04em;
    }
    .learn-row { padding: 12px 14px; border-bottom: 1px solid #f3f4f6; }
    .learn-row:last-child { border-bottom: none; }
    .learn-item-title { font-size: 14px; color: #111827; margin-bottom: 8px; line-height: 1.4; }
    .learn-links { display: flex; gap: 6px; flex-wrap: wrap; }
    .learn-link {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; padding: 6px 11px; border-radius: 8px;
      border: 1px solid #e5e7eb; background: #f9fafb;
      color: #374151; text-decoration: none; font-weight: 500;
      transition: all .15s;
    }
    .learn-link:hover { background: #f3f4f6; border-color: #d1d5db; }
    .learn-link.primary { background: #2e7d32; color: #fff; border-color: #2e7d32; }
    .learn-link.primary:hover { background: #1b5e20; }
    .learn-loading { padding: 20px; text-align: center; color: #9ca3af; font-size: 13px; line-height: 1.7; }

    /* ===== Section labels ===== */
    .section-label { font-size: 11px; font-weight: 700; color: #9ca3af; margin: 18px 2px 8px; letter-spacing: .07em; }

    /* ===== Task rows ===== */
    .trow {
      display: flex; align-items: center; gap: 10px;
      background: #fff; border: 1px solid #e5e7eb; border-radius: 14px;
      padding: 12px; margin-bottom: 8px;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
      transition: background .15s, border-color .15s;
    }
    .trow.s-done    { background: #f0fdf4; border-color: #86efac; }
    .trow.s-fail    { background: #fef2f2; border-color: #fca5a5; }
    .trow.s-partial { background: #fffbeb; border-color: #fcd34d; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .tmain { flex: 1; min-width: 0; }
    .ttitle { font-size: 15px; font-weight: 500; }
    .tmeta  { font-size: 11px; color: #9ca3af; margin-top: 3px; }
    .tbtns  { display: flex; gap: 5px; flex-shrink: 0; }
    .sb {
      width: 36px; height: 36px; border-radius: 10px;
      border: 1px solid #e5e7eb; background: #f9fafb;
      font-size: 14px; cursor: pointer; color: #9ca3af;
      display: flex; align-items: center; justify-content: center;
      transition: all .12s;
    }
    .sb:hover { background: #f3f4f6; }
    .sb.done.on { background: #16a34a; border-color: #16a34a; color: #fff; }
    .sb.fail.on { background: #dc2626; border-color: #dc2626; color: #fff; }
    .sb.part.on { background: #d97706; border-color: #d97706; color: #fff; }

    /* ===== Cards (goals / score / settings) ===== */
    .card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 16px;
      padding: 14px; margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .aicon {
      width: 38px; height: 38px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .aname { font-size: 16px; font-weight: 600; flex: 1; }
    .sub   { font-size: 12px; color: #9ca3af; margin-top: 2px; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 700; flex-shrink: 0;
    }
    .avatar.sm { width: 30px; height: 30px; font-size: 13px; display: inline-flex; vertical-align: middle; margin-left: 6px; }

    /* Goals rows */
    .grow {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 10px 4px; border-top: 1px solid #f3f4f6;
    }
    .grow:first-of-type { border-top: none; }
    .gtitle { font-size: 14px; font-weight: 500; }
    .gmeta  { font-size: 11px; color: #9ca3af; margin-top: 2px; }
    .off    { color: #dc2626; }

    /* Buttons */
    .mini {
      width: 32px; height: 32px; border-radius: 8px;
      border: 1px solid #e5e7eb; background: #f9fafb;
      cursor: pointer; font-size: 13px; color: #6b7280; margin-right: 4px;
    }
    .mini:hover { background: #f3f4f6; }
    .mini.danger { color: #dc2626; border-color: #fecaca; }
    .addbtn {
      width: 100%; padding: 11px; border: 1.5px dashed #d1d5db;
      border-radius: 12px; background: #fafafa; color: #6b7280;
      cursor: pointer; font-size: 13px; margin-top: 8px; font-weight: 500;
      transition: all .15s;
    }
    .addbtn:hover { background: #f3f4f6; }
    .addbtn.big {
      border-style: solid; border-color: #111827;
      background: #111827; color: #fff;
    }
    .addbtn.big:hover { background: #1f2937; }
    .danger-btn {
      width: 100%; padding: 11px; border: 1px solid #fca5a5;
      border-radius: 12px; background: #fff1f2; color: #991b1b;
      cursor: pointer; font-size: 13px; margin-top: 8px; font-weight: 500;
    }

    /* ===== Score ===== */
    .seg {
      display: flex; gap: 4px; background: #e5e7eb;
      border-radius: 12px; padding: 4px; margin-bottom: 16px;
    }
    .seg button {
      flex: 1; padding: 9px; border: none; border-radius: 9px;
      background: transparent; font-size: 13px; color: #9ca3af;
      cursor: pointer; font-weight: 500; transition: all .15s;
    }
    .seg button.active {
      background: #fff; color: #111827; font-weight: 700;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }
    .combined {
      text-align: center; font-size: 15px; color: #92400e;
      background: #fffbeb; border: 1px solid #fde68a;
      border-radius: 14px; padding: 14px; margin-bottom: 14px; font-weight: 600;
    }
    .combined b { font-size: 24px; }
    .statgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .stat { background: #f9fafb; border-radius: 10px; padding: 10px 4px; text-align: center; }
    .stat b { display: block; font-size: 20px; font-weight: 700; }
    .stat span { font-size: 10px; color: #9ca3af; }
    .stat.ok b { color: #16a34a; }
    .stat.bad b { color: #dc2626; }
    .stat.mid b { color: #d97706; }
    .breakdown { border-top: 1px solid #f3f4f6; padding-top: 10px; }
    .bd-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
    .bd-name { font-size: 12px; width: 90px; flex-shrink: 0; color: #374151; }
    .bar-wrap { flex: 1; background: #f3f4f6; border-radius: 20px; height: 8px; overflow: hidden; }
    .bar { height: 8px; border-radius: 20px; transition: width .5s; }
    .bd-pts { font-size: 12px; font-weight: 700; color: #92400e; width: 28px; text-align: left; }

    /* ===== Reflection ===== */
    .refl-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .refl-scope { font-size: 11px; font-weight: 700; color: #fff; background: #7c3aed; padding: 3px 10px; border-radius: 8px; }
    .refl-date  { font-size: 12px; color: #9ca3af; }
    .stars { color: #f59e0b; font-size: 17px; margin-bottom: 7px; letter-spacing: 3px; }
    .refl-text  { font-size: 14px; color: #374151; line-height: 1.7; white-space: pre-wrap; }
    .refl .mini { margin-top: 10px; width: auto; padding: 0 12px; }

    .empty { text-align: center; padding: 40px 20px; color: #9ca3af; font-size: 14px; line-height: 1.8; }
    .footnote { text-align: center; font-size: 11px; color: #d1d5db; margin: 24px 0 8px; }

    /* ===== Bottom navigation ===== */
    .nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; background: #fff;
      border-top: 1px solid #e5e7eb;
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
      z-index: 20;
      box-shadow: 0 -2px 14px rgba(0,0,0,.07);
    }
    .nav button {
      flex: 1; border: none; background: none; cursor: pointer;
      padding: 4px; display: flex; flex-direction: column;
      align-items: center; gap: 2px; color: #9ca3af;
      font-size: 10px; transition: color .15s;
    }
    .nav button .ic { font-size: 22px; }
    .nav button.active { color: #15803d; font-weight: 700; }

    /* ===== Form modal ===== */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.5); z-index: 50;
      align-items: flex-end; justify-content: center;
    }
    .overlay.show { display: flex; }
    .modal {
      background: #fff; border-radius: 20px 20px 0 0;
      padding: 22px; width: 100%; max-width: 620px;
      max-height: 88vh; overflow-y: auto;
    }
    @media (min-width: 560px) {
      .overlay { align-items: center; }
      .modal { border-radius: 20px; }
    }
    .modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px; text-align: center; }
    .modal label { display: block; font-size: 13px; color: #6b7280; margin-bottom: 12px; font-weight: 600; }
    .modal input, .modal select, .modal textarea {
      width: 100%; padding: 12px; border: 1.5px solid #d1d5db;
      border-radius: 10px; font-size: 16px; margin-top: 5px;
      background: #fff; color: #111827; font-family: inherit; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .modal input:focus, .modal select:focus, .modal textarea:focus {
      border-color: #15803d; box-shadow: 0 0 0 3px rgba(21,128,61,.12);
    }
    .modal input[type=color] { height: 46px; padding: 4px; }
    .modal textarea { resize: vertical; }
    .modal-btns { display: flex; gap: 8px; margin-top: 10px; }
    .modal-btns button {
      flex: 1; padding: 14px; border: none; border-radius: 12px;
      font-size: 15px; cursor: pointer; font-weight: 700;
    }
    .modal-btns .confirm { background: #15803d; color: #fff; }
    .modal-btns .confirm:hover { background: #166534; }
    .modal-btns .cancel { background: #f3f4f6; color: #374151; }
  </style>
</head>
<body>

<div class="header">
  <h1>🌱 צמיחה</h1>
  <p>לוז יומי · מעקב מידות · חשבון נפש</p>
</div>

<div class="content">

  <div class="tab active" id="tab-today">
    <div id="todayHead"></div>
    <div id="learningCard"></div>
    <div id="todayList"></div>
  </div>

  <div class="tab" id="tab-goals">
    <div class="section-label">תחומים ומשימות</div>
    <div id="goalsList"></div>
  </div>

  <div class="tab" id="tab-score">
    <div id="scoreList"></div>
  </div>

  <div class="tab" id="tab-reflect">
    <div id="reflectList"></div>
  </div>

  <div class="tab" id="tab-settings">
    <div id="settingsList"></div>
  </div>

</div>

<div class="nav">
  <button class="active" onclick="switchTab('today', this)"><span class="ic">📅</span>היום</button>
  <button onclick="switchTab('goals', this)"><span class="ic">🎯</span>יעדים</button>
  <button onclick="switchTab('score', this)"><span class="ic">🏆</span>ניקוד</button>
  <button onclick="switchTab('reflect', this)"><span class="ic">📝</span>חשבון נפש</button>
  <button onclick="switchTab('settings', this)"><span class="ic">⚙️</span>הגדרות</button>
</div>

<div class="overlay" id="formModal">
  <div class="modal">
    <h2 id="formTitle"></h2>
    <div id="formBody"></div>
    <div class="modal-btns">
      <button class="cancel" onclick="closeForm()">ביטול</button>
      <button class="confirm" onclick="submitForm()">שמירה</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
